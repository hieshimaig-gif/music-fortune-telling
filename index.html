<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日々の託宣</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- 画像生成用ライブラリ html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #0f1012;
      --card-bg: rgba(26, 27, 31, 0.92);
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text: #ececed;
      --text-sub: #b4b4bc;
      --border: rgba(212, 175, 55, 0.25);
      --seal-red: #a82020;
      --seal-border: #b82828;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Shippori Mincho', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 64px;
      -webkit-font-smoothing: antialiased;
    }

    /* 溜め（ローディング）画面 */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.8s ease;
    }
    .circle-pulse {
      width: 64px;
      height: 64px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.9; }
      100% { transform: scale(0.85); opacity: 0.25; }
    }
    .loading-text {
      margin-top: 24px;
      color: var(--gold-light);
      font-size: 0.85rem;
      letter-spacing: 0.25em;
    }

    /* メインコンテナ */
    .container {
      max-width: 480px;
      width: 100%;
      display: none;
      opacity: 0;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .container.show {
      display: block;
      opacity: 1;
    }

    /* キャプチャ対象エリア（画像書き出し対象） */
    #captureArea {
      padding: 16px 8px;
      background-color: var(--bg);
    }

    /* ヘッダー */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .date-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: var(--gold);
      letter-spacing: 0.15em;
    }
    .main-title {
      font-size: 1.35rem;
      letter-spacing: 0.3em;
      margin-top: 6px;
      font-weight: 600;
    }
    .notice-tag {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-light);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    /* 運勢カード本体 */
    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px 22px 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }
    .rank-wrap {
      text-align: center;
      margin-bottom: 20px;
    }
    .fortune-rank {
      font-size: 3rem;
      font-weight: 800;
      color: var(--gold-light);
      letter-spacing: 0.25em;
      text-indent: 0.25em;
      text-shadow: 0 0 18px rgba(212, 175, 55, 0.35);
    }

    /* 総合概況 */
    .quote-box {
      font-size: 0.92rem;
      line-height: 2.1;
      color: var(--text);
      text-align: justify;
      text-justify: inter-character;
      padding: 0 4px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 26px;
      letter-spacing: 0.05em;
    }

    /* 主題別セクション */
    .section-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .section-item {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeInUp 0.7s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }
    .section-label {
      font-size: 0.82rem;
      color: var(--gold);
      letter-spacing: 0.15em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .section-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(212, 175, 55, 0.2);
    }
    .section-text {
      font-size: 0.9rem;
      line-height: 1.9;
      color: var(--text-sub);
      text-align: justify;
      text-justify: inter-character;
      letter-spacing: 0.04em;
    }

    .key-box {
      margin-top: 32px;
      padding: 16px;
      background: rgba(212, 175, 55, 0.05);
      border: 1px dashed var(--border);
      text-align: center;
      font-size: 0.85rem;
      color: var(--gold-light);
      letter-spacing: 0.12em;
    }

    /* 落款印（印影）＆フッター署名エリア */
    .seal-footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid rgba(212, 175, 55, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .seal-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .seal-brand-en {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      color: var(--gold);
      letter-spacing: 0.18em;
      opacity: 0.85;
    }
    .seal-serial {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      color: var(--text-sub);
      letter-spacing: 0.12em;
      opacity: 0.65;
    }

    /* 格式高い朱泥の角印 */
    .seal-stamp {
      width: 48px;
      height: 48px;
      border: 2px solid var(--seal-border);
      border-radius: 4px;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: rgba(168, 32, 32, 0.06);
      box-shadow: inset 0 0 6px rgba(168, 32, 32, 0.2), 0 0 10px rgba(168, 32, 32, 0.15);
      transform: rotate(-1.5deg); /* 手押し感を演出する微小な傾き */
      flex-shrink: 0;
    }
    .seal-stamp-inner {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(184, 40, 40, 0.65);
      border-radius: 2px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      justify-items: center;
      padding: 1px;
    }
    .seal-char {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--seal-red);
      line-height: 1;
      text-shadow: 0 0 1px rgba(184, 40, 40, 0.5);
      user-select: none;
    }

    /* 保存アクションボタンエリア */
    .action-wrap {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .save-btn {
      width: 100%;
      max-width: 340px;
      padding: 15px 24px;
      background: transparent;
      color: var(--gold-light);
      border: 1px solid var(--gold);
      border-radius: 2px;
      font-family: 'Shippori Mincho', serif;
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .save-btn:active {
      transform: scale(0.98);
      background: rgba(212, 175, 55, 0.12);
    }
    .save-btn svg {
      width: 18px;
      height: 18px;
      stroke: var(--gold-light);
    }
    .save-hint {
      font-size: 0.75rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 溜め演出 -->
  <div id="loading">
    <div class="circle-pulse"></div>
    <div class="loading-text">本日のお導きを読み解いています</div>
  </div>

  <!-- メインコンテンツ -->
  <main class="container" id="mainContainer">
    <!-- 画像として切り出す領域 -->
    <div id="captureArea">
      <header class="header">
        <div class="date-badge" id="dispDate"></div>
        <h1 class="main-title">日 々 の 託 宣</h1>
        <div id="dispStatus" class="notice-tag">本日のお導き</div>
      </header>

      <div class="result-card">
        <div class="rank-wrap">
          <div class="fortune-rank" id="dispRank"></div>
        </div>
        
        <!-- 総合概況 -->
        <div class="quote-box" id="dispQuote"></div>

        <!-- 主題別運勢 -->
        <div class="section-list">
          <div class="section-item" style="animation-delay: 0.15s;">
            <div class="section-label">恋愛・対人運</div>
            <div class="section-text" id="dispLove"></div>
          </div>
          <div class="section-item" style="animation-delay: 0.3s;">
            <div class="section-label">仕事・事業運</div>
            <div class="section-text" id="dispWork"></div>
          </div>
          <div class="section-item" style="animation-delay: 0.45s;">
            <div class="section-label">金運・財運</div>
            <div class="section-text" id="dispMoney"></div>
          </div>
        </div>

        <div class="key-box" id="dispKey"></div>

        <!-- 落款印（印影）＆銘文署名 -->
        <div class="seal-footer">
          <div class="seal-meta">
            <span class="seal-brand-en">SACRED ORACLE ARCHIVE</span>
            <span class="seal-serial" id="dispSerial">CARD ID: DEFAULT_CARD</span>
          </div>
          <!-- 右上から縦書き読み「託宣之証」の四文字角印 -->
          <div class="seal-stamp" title="託宣之証">
            <div class="seal-stamp-inner">
              <span class="seal-char">託</span>
              <span class="seal-char">之</span>
              <span class="seal-char">宣</span>
              <span class="seal-char">証</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 保存ボタン -->
    <div class="action-wrap">
      <button class="save-btn" id="saveImageBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>託宣の証を保存する</span>
      </button>
      <div class="save-hint">※端末の写真アプリやファイルに保存されます</div>
    </div>
  </main>

  <script>
const POOLS = {
  ranks: ["大吉", "中吉", "吉", "小吉", "末吉"],

  // 1. 総合概況・託宣（20種類）
  quotes: [
    {
      id: "q1",
      text: "雲外に蒼天あり。水面下で静かに積み重ねてきた誠実な行いや鍛錬が、いま厚い雲を突き抜け、確かな光となって姿を現し始める刻です。これまで思うように進まなかった事柄も、堰を切ったように滑らかな流れへと変わりゆく気配を帯びています。焦って成果を急ぎ追う必要はありません。足元を一歩ずつ踏みしめ、自らの信念に従って堂々と前進することで、周囲の助力を得ながら大望を成し遂げる道が自然と拓かれていくでしょう。"
    },
    {
      id: "q2",
      text: "深き川は音を立てず、静けさの中にこそ大いなる力が宿ります。目前の小さな変化や外の喧騒に心を乱されることなく、今は地盤を固め、機が熟すのをじっくりと見極めるべき円熟の時です。性急な決断を避け、細部に至るまで点検を怠らない姿勢が、後に訪れる好機を確実に掴むための礎となります。静寂を味方につけ、内なる声に深く耳を澄ませることで、見落としていた本質や真に進むべき道筋が鮮明に浮かび上がってくるはずです。"
    },
    {
      id: "q3",
      text: "萬物が新たな命を宿す早春の風が吹き抜けています。これまでの停滞や古い思考の殻を脱ぎ捨て、未知の領域へと軽やかに歩みを進めるに相応しい巡りです。胸の内で温めていた計画や直感を疑うことなく、恐れずに最初の一歩を踏み出してください。たとえ最初は手探りであっても、動き出すこと自体が運命の歯車を噛み合わせ、思わぬ好縁や新たな知見を呼び込みます。過去の延長にとらわれず、瑞々しい感性で一日を迎えましょう。"
    },
    {
      id: "q4",
      text: "清風自ずから来たりて、水波自ずから興る。何かを無理に手元へ引き寄せようとする執着や余計な力みを解き放つことで、本当に必要としていた良縁や解決の糸口が自ずと舞い込んでくる兆しにあります。物事が予定通りに進まぬように見えても、それはより調和の取れた形へと軌道修正されている証左に他なりません。肩の力を抜き、巡り来る流れをあるがままに受け入れる余裕を持つことで、心の湖面は穏やかに澄み渡り、幸運の兆候を捉えます。"
    },
    {
      id: "q5",
      text: "水は方円の器に従い、千変万化の姿をもって岩をも穿ちます。己の流儀や固執した正しさを押し通すのではなく、周囲の状況や対峙する相手のあり方にしなやかに合わせる柔軟性こそが、あらゆる滞りを氷解させる最大の鍵となります。一見すると迂回しているように思える道のりも、結果としては最短で目的地へと至る知恵となります。頑なさを手放し、広やかな度量をもって日々の出来事に向き合うことで、災いは転じて福となるでしょう。"
    },
    {
      id: "q6",
      text: "磨穿鉄硯の気概が結実をもたらす刻です。誰の目にも触れぬ場所で黙々と筆を走らせてきたあなたの誠実さを、天も地も確かに見届けています。即効性を謳う軽薄な風潮に惑わされることなく、本質を極めんとする歩みを止めてはなりません。一見地味に思える基礎の反復こそが、他者の追随を許さぬ孤高の強さへと昇華されます。自負を胸に宿しつつも驕らず、淡々と己の務めを全うすれば、揺るぎなき名声が訪れます。"
    },
    {
      id: "q7",
      text: "明鏡止水の境地に至る好機です。湖面が波立てば月影が歪むように、焦燥や過剰な期待は物事の実相を曇らせてしまいます。一度深呼吸を置き、感情のさざ波を鎮めることで、事態の本質と真に打つべき一手がおのずと見えてくるでしょう。他者の評価や世間の風評に一喜一憂する必要はありません。鏡のように澄みきった眼差しで現実をあるがままに見つめ直すとき、迷いは消え去り、極めて的確な判断を下すことが可能となります。"
    },
    {
      id: "q8",
      text: "柳暗花明の兆しあり。行く手を遮る深い木立に迷い込み、進退窮まったように思えても、諦めずに歩みを進めれば、突如として視界が開け、艶やかな花咲く美しい里へと至る巡りです。現在の試練や停滞は、新たな局面へと飛躍するための必要な助走に過ぎません。悲観的な予測に囚われず、自らの生命力を信じて前を向いてください。予期せぬ方角から差し込む一筋の光明が、あなたを歓喜の境地へと導くでしょう。"
    },
    {
      id: "q9",
      text: "滴水穿石の教えを心に刻むべき日です。一滴の雫は儚くとも、絶え間なく同じ場所に落ち続けるならば、いずれ堅牢な大岩をも穿ち抜く偉力を発揮します。短期間で劇的な変化を求めようと焦る必要はありません。今日成すべき小さな善行やわずかな前進を慈しみ、確実に積み重ねてください。その寡黙な持続力こそが運命を切り拓く最強の刃となり、時が満ちたとき、想像を遥かに超える大業となって現れます。"
    },
    {
      id: "q10",
      text: "大器晩成の理が働いています。早く咲く花は散るのもまた早いもの。周囲の華々しい成功に目を奪われて焦燥感を抱くことなく、自らの根を土中深くへと張り巡らせることに専心してください。あなたが育てている樹木は、風雨に耐えうる巨木となる運命にあります。時間をかけて丁寧に練り上げられたものだけが、風化に耐える真の価値を持ち得ます。自らの歩幅を誇り、堂々たる構えで日々の営みを重ねてください。"
    },
    {
      id: "q11",
      text: "虚室生白、すなわち余計な夾雑物を払い清めることで、部屋の隅々にまで純白の光が満ち渡るような好気運です。あれもこれもと抱え込みすぎた荷物を下ろし、思考や身辺を身軽に整えることが求められています。空白を恐れて過密に埋めようとするのではなく、余白の中にこそ真の叡智とひらめきが宿ることを知ってください。不要な縁や古びた固定観念を手放した瞬間、驚くほど澄明なエネルギーが全身を駆け巡ります。"
    },
    {
      id: "q12",
      text: "疾風知勁草。吹き荒れる激しい風の中でこそ、容易に折れぬ真に強靭な草の存在が明らかとなります。日常の平穏を揺るがすような出来事や予想外の展開が訪れたとしても、それはあなたの内に眠る本物の胆力と品格を証明するための舞台に他なりません。動揺を周囲に見せず、静かに構えて対処するあなたの姿は、多くの人々に安心感と希望を与えるでしょう。嵐の過ぎ去った後には、清々しい栄光が待っています。"
    },
    {
      id: "q13",
      text: "千里の行も足下一歩より始まります。遥かな頂を見上げてその険しさに立ちすくむのではなく、いま足元にある土をしっかりと踏みしめることに意識を集中させてください。偉大な達成も、分解してみれば日々の些細な決断と所作の集積に他なりません。最初から完全無欠を目指す必要はなく、不完全なままでも歩を進める勇気こそが尊いのです。今日踏み出すそのささやかな一歩が、運命の地平線を確実に押し広げていきます。"
    },
    {
      id: "q14",
      text: "竹林に風過ぐるが如き柔軟さが吉を呼びます。風が吹けば身を撓らせ、風が去れば元の凛とした立ち姿に戻る竹のように、余計な摩擦を生まずに世の荒波を受け流す知恵を活かしてください。正面から抗おうとすれば強固な大木ですらへし折れますが、しなやかさを持つ者は決して折れることがありません。白黒を急いでつけようとせず、曖昧さをも包み込む大らかな寛容さを持つことで、あらゆる災禍を無傷でやり過ごせます。"
    },
    {
      id: "q15",
      text: "朝露の如く清冽なる気が満ちています。昨日までの後悔や疲弊は夜の帳とともに消え去り、あなたの前には白紙の新しい世界が広がっています。過去の過ちを悔やみ続けるのは時間の浪費に過ぎません。いま、この瞬間に呼吸を整え、まっさらな眼差しで世界を見つめ直してください。瑞々しい初心を取り戻すことで、日々の見慣れた光景の中に無数の好機と祝福が潜んでいたことに気づくはずです。清廉な心で歩み出しましょう。"
    },

    let currentDateStr = "";

    window.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const cardId = params.get('cid') || 'DEFAULT_CARD';

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const todayStr = `${yyyy}-${mm}-${dd}`;
      currentDateStr = `${yyyy}${mm}${dd}`;

      const storageKey = `omikuji_history_${cardId}`;
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem(storageKey)) || [];
      } catch (e) {
        history = [];
      }

      const todayRecord = history.find(h => h.date === todayStr);
      let resultData;
      let isAlreadyDrawn = false;

      if (todayRecord) {
        resultData = todayRecord.result;
        isAlreadyDrawn = true;
      } else {
        const recentHistory = history.slice(-3);
        const excludeIds = new Set();
        recentHistory.forEach(h => {
          if (h.result && h.result.itemIds) {
            h.result.itemIds.forEach(id => excludeIds.add(id));
          }
        });

        const pickNonRepeating = (pool) => {
          const available = pool.filter(item => !excludeIds.has(item.id));
          const candidates = available.length > 0 ? available : pool;
          return candidates[Math.floor(Math.random() * candidates.length)];
        };

        const rank = POOLS.ranks[Math.floor(Math.random() * POOLS.ranks.length)];
        const q = pickNonRepeating(POOLS.quotes);
        const l = pickNonRepeating(POOLS.love);
        const w = pickNonRepeating(POOLS.work);
        const m = pickNonRepeating(POOLS.money);
        const k = POOLS.keys[Math.floor(Math.random() * POOLS.keys.length)];

        resultData = {
          rank: rank,
          quote: q.text,
          love: l.text,
          work: w.text,
          money: m.text,
          key: k,
          itemIds: [q.id, l.id, w.id, m.id]
        };

        history.push({ date: todayStr, result: resultData });
        const trimmed = history.slice(-10);
        localStorage.setItem(storageKey, JSON.stringify(trimmed));
      }

      document.getElementById('dispDate').textContent = `${yyyy}.${mm}.${dd}`;
      document.getElementById('dispRank').textContent = resultData.rank;
      document.getElementById('dispQuote').textContent = resultData.quote;
      document.getElementById('dispLove').textContent = resultData.love;
      document.getElementById('dispWork').textContent = resultData.work;
      document.getElementById('dispMoney').textContent = resultData.money;
      document.getElementById('dispKey').textContent = `開運の鍵：${resultData.key}`;
      document.getElementById('dispSerial').textContent = `CARD ID: ${cardId}`;

      if (isAlreadyDrawn) {
        document.getElementById('dispStatus').textContent = "本日引いた託宣（鑑定済）";
      }

      await new Promise(r => setTimeout(r, 1200));

      const loading = document.getElementById('loading');
      loading.style.opacity = '0';
      setTimeout(() => {
        loading.style.display = 'none';
        document.getElementById('mainContainer').classList.add('show');
      }, 800);

      document.getElementById('saveImageBtn').addEventListener('click', saveAsImage);
    });

    async function saveAsImage() {
      const btn = document.getElementById('saveImageBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span>画像を生成中...</span>';
      btn.style.pointerEvents = 'none';

      try {
        const captureArea = document.getElementById('captureArea');

        const canvas = await html2canvas(captureArea, {
          backgroundColor: '#0f1012',
          scale: 2,
          useCORS: true,
          logging: false
        });

        canvas.toBlob(async (blob) => {
          const fileName = `omikuji_${currentDateStr}.png`;
          const file = new File([blob], fileName, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: '日々の託宣',
                text: '本日のお導きを保存しました。'
              });
              btn.innerHTML = originalText;
              btn.style.pointerEvents = 'auto';
              return;
            } catch (shareErr) {
              if (shareErr.name === 'AbortError') {
                btn.innerHTML = originalText;
                btn.style.pointerEvents = 'auto';
                return;
              }
            }
          }

          const imgUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.href = imgUrl;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          btn.innerHTML = '<span>保存完了</span>';
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.pointerEvents = 'auto';
          }, 2000);
        }, 'image/png');

      } catch (err) {
        console.error('画像保存エラー:', err);
        alert('画像の保存に失敗しました。');
        btn.innerHTML = originalText;
        btn.style.pointerEvents = 'auto';
      }
    }
  </script>
</body>
</html>
